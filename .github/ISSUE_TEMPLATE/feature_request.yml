name: Feature request
description: Propose a focused public RuleOak improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed RuleOak boundary
      description: Where should authorization occur before execution?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Include expected allow, deny, approval, and evidence behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
